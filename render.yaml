services:
  - type: web
    name: whatsapp-ai-helper
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VERIFY_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: GRAPH_API_VERSION
        value: v23.0
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: ACTIVE_BUSINESS
        value: guest-house
      - key: OWNER_WHATSAPP
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: "91"
      - key: DATABASE_PATH
        value: data/bot.db
      - key: MEMORY_LIMIT
        value: "15"
      - key: PAUSE_HOURS
        value: "12"
      - key: LOG_LEVEL
        value: INFO
